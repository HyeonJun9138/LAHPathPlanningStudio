[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lah-path-planning-studio"
version = "0.1.0"
description = "LAH Terrain Path Planning Studio - 3D sparse waypoint path planning research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.1",
    "sb3-contrib>=2.1",
    "torch>=2.0",
    "plotly>=5.15",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]
