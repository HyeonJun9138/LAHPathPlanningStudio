# Default candidate waypoint generation configuration.
# The candidate generator produces K candidate next-waypoints at each
# decision step.  The policy then selects one (with action masking for
# infeasible candidates).

name: candidate_default
description: >
  Default settings for sparse waypoint candidate generation.
  Produces 32 candidates arranged in concentric rings around the
  agent's current position, with altitude variations.

# ── Core parameters ──────────────────────────────────────────────────

# Total number of candidate waypoints per step.
num_candidates: 32

# Candidate generation method: ring | grid | goal_biased | hybrid
method: hybrid

# ── Ring-based generation ────────────────────────────────────────────

ring:
  # Number of concentric distance rings.
  num_rings: 3
  # Distance of each ring from the current position (metres).
  ring_distances_m: [500.0, 1000.0, 2000.0]
  # Number of azimuth samples per ring.
  azimuths_per_ring: 8
  # Whether to bias azimuth sampling toward the goal bearing.
  goal_bias: true
  # Concentration of azimuth samples around goal bearing (0 = uniform, higher = tighter).
  goal_bias_kappa: 2.0

# ── Altitude variations ─────────────────────────────────────────────

altitude:
  # AGL options relative to current altitude (metres).
  delta_agl_options_m: [-15.0, 0.0, 15.0]
  # Minimum AGL (hard floor, metres).
  min_agl_m: 10.0
  # Maximum AGL (hard ceiling, metres).
  max_agl_m: 300.0

# ── Goal-biased candidates ──────────────────────────────────────────

goal_bias:
  # Number of candidates placed along the direct line to goal.
  num_direct: 4
  # Distances along the goal bearing (metres).
  distances_m: [500.0, 1000.0, 2000.0, 3000.0]

# ── Feasibility masking ─────────────────────────────────────────────

masking:
  # Minimum terrain clearance for a candidate to be feasible (metres).
  min_clearance_m: 10.0
  # Maximum slope at the candidate position (degrees).
  max_slope_deg: 60.0
  # Maximum risk value at the candidate position [0, 1].
  max_risk: 0.95
  # Whether to mask candidates inside hard restricted zones.
  mask_restricted_zones: true
  # Maximum straight-line distance the agent can travel in one step (metres).
  max_step_distance_m: 4000.0
  # Minimum distance to avoid trivially short moves (metres).
  min_step_distance_m: 100.0

# ── Motion primitive validation ──────────────────────────────────────

primitive:
  # Interpolation points along the flight segment for collision checks.
  interpolation_points: 10
  # Maximum climb/descent angle (degrees from horizontal).
  max_climb_angle_deg: 25.0
  max_descent_angle_deg: 30.0
  # Maximum turn rate (degrees per 100m of horizontal travel).
  max_turn_rate_deg_per_100m: 45.0
