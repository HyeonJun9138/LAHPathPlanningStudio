version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)-8s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)-8s] %(name)s (%(filename)s:%(lineno)d) %(funcName)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ./workspace/logs/app.log
    maxBytes: 10485760       # 10 MB
    backupCount: 5
    encoding: utf-8
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: ./workspace/logs/error.log
    maxBytes: 5242880        # 5 MB
    backupCount: 3
    encoding: utf-8

loggers:
  engine:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false
  engine.terrain:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  engine.hazard:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  engine.training:
    level: INFO
    handlers: [console, file]
    propagate: false
  engine.reporting:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
